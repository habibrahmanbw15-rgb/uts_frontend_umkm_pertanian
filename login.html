<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pertanian Cerdas</title>
    <!-- CSS khusus halaman login -->
    <link rel="stylesheet" href="assets/css/login.css">
</head>
<body class="login-page">
    <main class="login-card">
        <div class="login-brand">
            <div class="login-logo" aria-hidden="true">
                <!-- ikon tunas (outline) -->
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M7 20h10"/>
                    <path d="M10 20c5.5-2.5.8-6.4 3-10"/>
                    <path d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8z"/>
                    <path d="M14.1 6a7 7 0 0 0-1.1 4c1.9-.1 3.3-.6 4.3-1.4 1-1 1.6-2.3 1.7-4.6-2.7.1-4 1-4.9 2z"/>
                </svg>
            </div>
            <h1 class="login-title">Masuk Pertanian Cerdas</h1>
            <p class="login-subtitle">Silakan masuk sebagai Admin atau lewati sebagai Tamu.</p>
        </div>

        <form id="loginForm" class="login-form" novalidate>
            <div class="login-field">
                <label class="login-label" for="username">Username / Email</label>
                <div class="login-input-wrap">
                    <svg class="login-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    <input class="login-input" type="text" id="username" autocomplete="username" placeholder="Ketik 'admin' untuk akses admin">
                </div>
            </div>

            <div class="login-field">
                <label class="login-label" for="password">Password</label>
                <div class="login-input-wrap">
                    <svg class="login-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="3" y="11" width="18" height="11" rx="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    <input class="login-input" type="password" id="password" autocomplete="current-password" placeholder="........">
                    <button type="button" class="login-toggle" id="togglePassword" aria-label="Tampilkan password">
                        <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M9.9 4.2A10.6 10.6 0 0 1 12 4c6.4 0 10 8 10 8a17 17 0 0 1-3.2 4.2"/>
                            <path d="M6.6 6.6A16.6 16.6 0 0 0 2 12s3.6 8 10 8a9.7 9.7 0 0 0 5.4-1.6"/>
                            <path d="M14.1 14.1a3 3 0 0 1-4.2-4.2"/>
                            <path d="m2 2 20 20"/>
                        </svg>
                    </button>
                </div>
            </div>

            <small class="login-error" id="loginError" role="alert"></small>

            <button type="submit" class="login-btn login-btn-primary">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                    <path d="m10 17 5-5-5-5"/>
                    <path d="M15 12H3"/>
                </svg>
                Login sebagai Admin
            </button>
        </form>

        <div class="login-divider">atau</div>

        <button id="guestBtn" type="button" class="login-btn login-btn-guest">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/>
                <circle cx="12" cy="12" r="3"/>
            </svg>
            Masuk sebagai Pengguna / Tamu
        </button>
    </main>

    <!-- Tombol lihat/sembunyikan password -->
    <script>
        (function () {
            var btn = document.getElementById('togglePassword');
            var input = document.getElementById('password');
            btn.addEventListener('click', function () {
                var show = input.type === 'password';
                input.type = show ? 'text' : 'password';
                btn.classList.toggle('is-visible', show);
                btn.setAttribute('aria-label', show ? 'Sembunyikan password' : 'Tampilkan password');
            });
        })();
    </script>
    <script type="module" src="assets/js/loginApp.js"></script>
</body>
</html>
